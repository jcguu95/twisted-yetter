[project]
name = "twisted-yetter"
version = "0.1.0"
description = "Research workspace for twisted Yetter invariants."
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.3,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
